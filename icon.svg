<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="iMakeGames">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#238a52"/>
      <stop offset="1" stop-color="#0c3a21"/>
    </linearGradient>
    <path id="heart" d="M0 46C-78-6-56-62-22-56-9-54 0-43 0-33 0-43 9-54 22-56 56-62 78-6 0 46Z"/>
    <path id="spark" d="M0-30C4-10 10-4 30 0 10 4 4 10 0 30-4 10-10 4-30 0-10-4-4-10 0-30Z"/>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#felt)"/>

  <!-- spade card, behind -->
  <g transform="translate(180 272) rotate(-14)">
    <rect x="-86" y="-118" width="184" height="256" rx="24" fill="#000" opacity=".25"/>
    <rect x="-92" y="-128" width="184" height="256" rx="24" fill="#fff"/>
    <g transform="translate(-24 -8) scale(1)" fill="#111827">
      <use href="#heart" transform="scale(1 -1)"/>
      <path d="M-20 70L20 70 0 30Z"/>
    </g>
  </g>

  <!-- heart card, in front -->
  <g transform="translate(334 254) rotate(12)">
    <rect x="-86" y="-118" width="184" height="256" rx="24" fill="#000" opacity=".25"/>
    <rect x="-92" y="-128" width="184" height="256" rx="24" fill="#fff"/>
    <use href="#heart" transform="translate(0 -4) scale(1.15)" fill="#dc2626"/>
  </g>

  <!-- the "make" sparkle -->
  <use href="#spark" transform="translate(414 98)" fill="#fbbf24"/>
  <use href="#spark" transform="translate(452 146) scale(.45)" fill="#fde68a"/>
</svg>
