<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="iMakeGames">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b73ff"/>
      <stop offset="1" stop-color="#1a2160"/>
    </linearGradient>
    <g id="pad">
      <rect x="84" y="186" width="344" height="148" rx="74"/>
      <circle cx="146" cy="322" r="68"/>
      <circle cx="366" cy="322" r="68"/>
    </g>
    <path id="spark" d="M0-30C4-10 10-4 30 0 10 4 4 10 0 30-4 10-10 4-30 0-10-4-4-10 0-30Z"/>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- controller -->
  <use href="#pad" transform="translate(0 12)" fill="#0b1130" opacity=".3"/>
  <use href="#pad" fill="#fff"/>
  <!-- d-pad -->
  <g transform="translate(172 262)" fill="#1a2160">
    <rect x="-11" y="-34" width="22" height="68" rx="7"/>
    <rect x="-34" y="-11" width="68" height="22" rx="7"/>
  </g>
  <!-- buttons -->
  <circle cx="352" cy="234" r="15" fill="#fbbf24"/>
  <circle cx="392" cy="270" r="15" fill="#f87171"/>
  <circle cx="352" cy="306" r="15" fill="#4ade80"/>
  <circle cx="312" cy="270" r="15" fill="#60a5fa"/>

  <!-- the "make" sparkle -->
  <use href="#spark" transform="translate(396 118)" fill="#fbbf24"/>
  <use href="#spark" transform="translate(438 166) scale(.45)" fill="#fde68a"/>
</svg>
