<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>iMakeGames</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { color-scheme: dark; --bg: #0b1020; --card: #151c33; --text: #eef1fb; --muted: #9aa4c7; --accent: #6ea8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif;
           padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
    header { max-width: 960px; margin: 0 auto 24px; display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; }
    .logo { grid-row: span 2; width: 56px; height: 56px; border-radius: 14px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    header p { margin: 0; color: var(--muted); }
    #games { max-width: 960px; margin: 0 auto; display: grid; gap: 12px;
             grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    a.game { display: block; padding: 16px; border-radius: 14px; background: var(--card); color: inherit;
             text-decoration: none; border: 1px solid transparent; }
    a.game:hover, a.game:focus-visible { border-color: var(--accent); outline: none; }
    a.game h2 { margin: 0 0 4px; font-size: 1.1rem; }
    a.game p { margin: 0; color: var(--muted); font-size: .9rem; }
    .meta { margin-top: 8px; font-size: .8rem; color: var(--accent); }
    #empty { max-width: 960px; margin: 0 auto; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="icon.svg" alt="" width="56" height="56">
    <h1>iMakeGames</h1>
    <p>Pick a game. Play on this device or with friends.</p>
  </header>
  <main id="games"></main>
  <p id="empty" hidden>No games yet.</p>
  <script type="module" src="launcher.js"></script>
</body>
</html>
